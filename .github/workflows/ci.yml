name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  NXF_ANSI_LOG: false

jobs:
  unit:
    name: Unit tests (one planted failure per gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install numpy pandas scipy pytest
      - run: bash tests/run_tests.sh
      # Compared decompressed: gzip header bytes vary with the Python/zlib
      # version that wrote them; the content must not.
      - name: Test data is reproducible from the generator
        run: |
          python3 tests/make_test_data.py regen >/dev/null
          for f in tests/data/*; do
            cmp <(zcat -f "$f") <(zcat -f "regen/$(basename "$f")") || { echo "differs: $f"; exit 1; }
          done

  pipeline:
    name: End to end, Nextflow ${{ matrix.nxf }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nxf: ['24.10.0', 'latest-stable']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: nf-core/setup-nextflow@v2
        with: { version: '${{ matrix.nxf }}' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Build container
        run: docker build -t mageckinator:ci .
      - run: echo "process.container = 'mageckinator:ci'" > ci.config

      - name: Lint (strict syntax)
        if: matrix.nxf == 'latest-stable'
        run: nextflow lint .

      - name: Wiring only (stub), no tools needed
        run: nextflow run . -profile test -stub-run -c ci.config --outdir stubout

      - name: Run test profile
        run: nextflow run . -profile test,docker -c ci.config --outdir results
      - name: Assert results against the planted truth
        run: python tests/check_test_results.py results

      # ---- every gate must stop the run -------------------------------
      - name: A comparison of a condition against itself must fail
        run: |
          if nextflow run . -profile test,docker -c ci.config \
               --comparisons tests/data/comparisons_bad.csv --outdir neg1; then
            echo "self-vs-self comparison accepted"; exit 1; fi
          test ! -d neg1/test
      - name: A spacer shared across genes must fail library validation
        run: |
          if nextflow run . -profile test,docker -c ci.config \
               --library tests/data/library_dup.csv --outdir neg2; then
            echo "ambiguous library accepted"; exit 1; fi
      - name: A swapped baseline library must fail count QC before testing
        run: |
          if nextflow run . -profile test,docker -c ci.config \
               --count_table tests/data/counts_swapped.tsv --outdir neg3; then
            echo "swapped baseline accepted"; exit 1; fi
          test ! -d neg3/test
      - name: Essentials that do not deplete must fail the control check
        run: |
          if nextflow run . -profile test,docker -c ci.config \
               --essential_genes tests/data/fake_essentials.txt --outdir neg4; then
            echo "dead screen accepted"; exit 1; fi
      - name: Published hits our ranking does not recover must fail reconciliation
        run: |
          if nextflow run . -profile test,docker -c ci.config \
               --published_hits tests/data/wrong_published.tsv --outdir neg5; then
            echo "mismatched reconciliation accepted"; exit 1; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-nxf-${{ matrix.nxf }}
          path: |
            results/summary.tsv
            results/comparisons.tsv
            results/design/
            results/count/
            results/test/
            results/qc/
            results/pipeline_info/
            .nextflow.log

  publish:
    name: Publish container to GHCR
    needs: [unit, pipeline]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=dev,enable={{is_default_branch}}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
